# =====================================================================
#  Блиц-опрос — настройки nginx для обмена данными
#  Адрес обмена: http://194.87.103.77/blitz
#
#  Куда положить (Debian/Ubuntu):
#    sudo cp blitz.conf /etc/nginx/conf.d/blitz.conf
#  или, если используется схема sites-available/sites-enabled:
#    sudo cp blitz.conf /etc/nginx/sites-available/blitz
#    sudo ln -s /etc/nginx/sites-available/blitz /etc/nginx/sites-enabled/
#
#  Если на сервере уже есть свой server{} для 194.87.103.77 — просто
#  перенесите блоки location внутрь него (два location ниже).
#
#  Проверка и перезагрузка:
#    sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name 194.87.103.77;

    # Файлы по пути /blitz/... берутся из каталога /var/www/blitz/...
    root /var/www;

    # /blitz без слэша -> /blitz/
    location = /blitz { return 301 /blitz/; }

    # ---------------------------------------------------------------
    #  Все запросы /blitz/... : CORS + WebDAV (PUT/DELETE) + autoindex
    # ---------------------------------------------------------------
    location /blitz/ {

        # --- CORS: разрешаем запросы со страницы на GitHub Pages ---
        add_header Access-Control-Allow-Origin      "*"                        always;
        add_header Access-Control-Allow-Methods     "GET, PUT, DELETE, MKCOL, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers    "Date, ETag, Last-Modified" always;
        add_header Cache-Control                    "no-store"                 always;

        # --- CORS preflight: браузер сначала спрашивает OPTIONS ---
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin   "*";
            add_header Access-Control-Allow-Methods  "GET, PUT, DELETE, MKCOL, OPTIONS";
            add_header Access-Control-Allow-Headers  "Content-Type, Authorization";
            add_header Access-Control-Max-Age        86400;
            add_header Content-Length                0;
            add_header Content-Type                  "text/plain";
            return 204;
        }

        # --- простые WebDAV-методы nginx: браузер пишет JSON-файлы сам ---
        dav_methods          PUT DELETE MKCOL;
        create_full_put_path on;                    # nginx сам создаст недостающие каталоги
        dav_access           user:rw group:rw all:r; # права 664 на новые файлы

        # Ответы — маленькие JSON, большого не нужно
        client_max_body_size 2m;

        # --- GET каталога отдаёт список файлов (учитель опрашивает ответы) ---
        autoindex on;
    }

    # ---------------------------------------------------------------
    #  НЕОБЯЗАТЕЛЬНО: защита записи паролем.
    #  Раскомментируйте блок ниже, чтобы файлы в rooms/ и results/
    #  мог писать только преподаватель (студенты — только читать).
    #  Тот же логин/пароль укажите в поле «Пароль учителя» на странице
    #  преподавателя. Создание файла паролей:
    #    sudo htpasswd -bc /etc/nginx/blitz.htpasswd teacher ПАРОЛЬ
    #  (пакет apache2-utils; если пароль не используется — поле оставьте пустым)
    # ---------------------------------------------------------------
    # location ~ ^/blitz/data/(rooms|results)/ {
    #     add_header Access-Control-Allow-Origin   "*"                        always;
    #     add_header Access-Control-Allow-Methods  "GET, PUT, DELETE, OPTIONS" always;
    #     add_header Access-Control-Allow-Headers  "Content-Type, Authorization" always;
    #     add_header Access-Control-Expose-Headers "Date, ETag, Last-Modified" always;
    #     add_header Cache-Control                 "no-store"                 always;
    #     if ($request_method = OPTIONS) {
    #         add_header Access-Control-Allow-Origin   "*";
    #         add_header Access-Control-Allow-Methods  "GET, PUT, DELETE, OPTIONS";
    #         add_header Access-Control-Allow-Headers  "Content-Type, Authorization";
    #         add_header Access-Control-Max-Age        86400;
    #         return 204;
    #     }
    #     dav_methods          PUT DELETE;
    #     create_full_put_path on;
    #     dav_access           user:rw group:rw all:r;
    #     client_max_body_size 2m;
    #     limit_except GET {
    #         auth_basic            "Blitz teacher";
    #         auth_basic_user_file  /etc/nginx/blitz.htpasswd;
    #     }
    # }
}
